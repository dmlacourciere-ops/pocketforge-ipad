<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="PocketForge: a local game workspace with an AI agent, source editor, and playable preview.">
  <meta name="theme-color" content="#111314">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PocketForge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>PocketForge</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #111314; }
    #fah-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; background: #111314; color: #e8edec;
      font-family: system-ui, -apple-system, sans-serif;
      transition: opacity 0.25s ease;
    }
    #fah-splash.fah-done { opacity: 0; pointer-events: none; }
    .forge-name { font-size: 19px; font-weight: 600; letter-spacing: -0.5px; }
    .forge-note { margin-top: -8px; font-size: 11px; color: #9aa6a4; }
    .forge-bar { width: 120px; height: 2px; background: #2c3233; overflow: hidden; border-radius: 2px; }
    .forge-bar::after { content: ""; display: block; width: 40%; height: 100%; background: #8cdac3; animation: forge-loading 1.3s ease-in-out infinite; }
    @keyframes forge-loading { from { transform: translateX(-120%); } to { transform: translateX(370%); } }
    @media (prefers-reduced-motion: reduce) {
      #fah-splash { transition: none; }
      .forge-bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <!-- The existing lifecycle helper removes this once Flutter paints. -->
  <div id="fah-splash" role="status" aria-label="Opening PocketForge">
    <svg width="64" height="64" viewBox="0 0 1024 1024" aria-hidden="true">
      <rect width="1024" height="1024" rx="220" fill="#191c1d"/>
      <path d="M420 345 255 512 420 679 M604 345 769 512 604 679"
        fill="none" stroke="#8cdac3" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="forge-name">pocketforge</div>
    <div class="forge-note">Opening your workspace</div>
    <div class="forge-bar" aria-hidden="true"></div>
  </div>
  <script src="inline_script_1.js"></script>
  <!-- Local project persistence; no provider credentials are stored here. -->
  <script src="fs_store.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
